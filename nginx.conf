server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text and assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Long cache for hashed assets (vite generates a unique name per build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API and files served by exam-app (proxy to avoid CORS).
    # `/api` covers chat SSE and attachments; the backend REST routes
    # live at the root (/subjects, /questions) and are proxied explicitly
    # so the frontend always uses the same origin. NOTE: /exams is NOT
    # proxied — the SPA route /exams must serve index.html (the backend
    # only exposes /subjects/{id}/exams and POST /exams/generate, which
    # the frontend calls via /api-style paths from the same origin).
    location /api/ {
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /subjects {
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
    }

    location /questions {
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
    }

    # Auth endpoints (register/login/me): the SPA route is /login, so
    # /auth/* never collides with a frontend route.
    location /auth/ {
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
    }

    location /output/ {
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
    }

    # WebSocket (event bus).
    location /ws {
        proxy_pass http://exam-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # OpenAI-compatible legacy (OpenWebUI).
    location /v1/ {
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback: any other route serves index.html.
    # index.html must NOT be cached: it references the hashed bundle names,
    # and a stale copy loads an old JS bundle after each deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
