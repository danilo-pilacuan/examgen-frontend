server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow real study material uploads (textbooks are 2-50 MB; nginx
    # default is 1m which rejects them with 413).
    client_max_body_size 100m;

    # Gzip for text and assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Long cache for hashed assets (vite generates a unique name per build).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API and files served by exam-app (proxy to avoid CORS).
    # `/api` covers chat SSE and attachments; the backend REST routes
    # live at the root (/subjects, /questions) and are proxied explicitly
    # so the frontend always uses the same origin. NOTE: only the exact
    # POST /exams/generate endpoint is proxied below — the SPA route
    # /exams must still serve index.html.
    location /api/ {
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Long chat turns (exam generation runs several minutes of LLM
        # calls) must not be cut by the default 60s read timeout, and
        # text/event-stream requires buffering disabled.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Exam generation endpoint (POST): exact match so the SPA route
    # /exams keeps serving index.html. Long timeouts: the pipeline runs
    # several minutes of LLM calls and the browser awaits the response.
    location = /exams/generate {
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Subjects/questions REST routes. The SPA route /subjects must still
    # serve index.html on hard reload, so only requests that expect a JSON
    # API response are proxied (apiFetch sends Accept: application/json;
    # document navigations send text/html).
    location /subjects {
        if ($http_accept ~* "application/json") {
            rewrite ^/subjects(.*)$ /subjects-api$1 last;
        }
        try_files $uri /index.html;
    }
    # The inner rewrite strips the /subjects-api prefix but keeps the rest
    # of the path (/subjects, /subjects/{id}/questions, ...).
    location /subjects-api {
        rewrite ^/subjects-api(/.*)$ /subjects$1 break;
        rewrite ^/subjects-api$ /subjects break;
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
    }

    location /questions {
        if ($http_accept ~* "application/json") {
            rewrite ^/questions(.*)$ /questions-api$1 last;
        }
        try_files $uri /index.html;
    }
    location /questions-api {
        rewrite ^/questions-api(/.*)$ $1 break;
        rewrite ^/questions-api$ /questions break;
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
    }

    # Auth endpoints (register/login/me): the SPA route is /login, so
    # /auth/* never collides with a frontend route.
    location /auth/ {
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
    }

    location /output/ {
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
    }

    # WebSocket (event bus).
    location /ws {
        proxy_pass http://exam-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # OpenAI-compatible legacy (OpenWebUI).
    location /v1/ {
        proxy_pass http://exam-app:8000;
        proxy_set_header Host $host;
    }

    # SPA fallback: any other route serves index.html.
    # index.html must NOT be cached: it references the hashed bundle names,
    # and a stale copy loads an old JS bundle after each deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
